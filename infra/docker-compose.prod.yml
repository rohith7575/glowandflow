# Production: web app only (SQLite file stored in ./data volume).
services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: file:/app/data/app.db
      APP_VERSION: "0.1.0"
    ports:
      - "3000:3000"
    volumes:
      - ../data:/app/data