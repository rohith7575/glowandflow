# Cloudflare Tunnel config. Replace <TUNNEL_ID> and hostname with your values.
# Create tunnel: cloudflared tunnel create glow-and-flow
# Route DNS:    cloudflared tunnel route dns glow-and-flow app.yourdomain.com
tunnel: <TUNNEL_ID>
credentials-file: /home/<user>/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: app.yourdomain.com
    service: http://localhost:3000
  - service: http_status:404